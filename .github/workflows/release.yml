# Build Buffers and publish it to a GitHub Release.
#
# Fires on a version tag (v0.1.0 → release "Buffers 0.1.0"), or by hand from the
# Actions tab for a dry run that builds and uploads an artifact without releasing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Needed to create the release and upload assets.
permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: v
        shell: bash
        run: |
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            # A tag that disagrees with the app's own version ships a binary that
            # reports the wrong number — fail loudly instead.
            if [[ "$tag" != "$conf" ]]; then
              echo "::error::Tag v$tag does not match tauri.conf.json version $conf"
              exit 1
            fi
            echo "version=$tag" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$conf" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # Match the pnpm major that wrote pnpm-lock.yaml, so --frozen-lockfile
      # can't trip over a lockfile a newer pnpm produced.
      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --no-bundle skips the NSIS installer: we ship the standalone exe only.
      - name: Build
        run: pnpm tauri build --no-bundle --target x86_64-pc-windows-msvc

      - name: Name the artifact
        id: art
        shell: bash
        run: |
          src="src-tauri/target/x86_64-pc-windows-msvc/release/buffers.exe"
          name="Buffers-${{ steps.v.outputs.version }}-win_x64-portable.exe"
          # A second, version-less copy. Release assets are addressable at
          # /releases/latest/download/<file>, which only works if the file name
          # is the same in every release — so the versioned copy is for
          # archives, and this one is what README links to.
          stable="Buffers-win_x64-portable.exe"
          # Staged in its own directory, NOT dist/ — that's Vite's output folder
          # (tauri.conf frontendDist = ../dist), so globbing dist/* would sweep
          # index.html and the bundled assets into the release.
          mkdir -p release-assets
          cp "$src" "release-assets/$name"
          cp "$src" "release-assets/$stable"
          (cd release-assets && sha256sum "$name" > "$name.sha256" && sha256sum "$stable" > "$stable.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l release-assets

      # A copy attached to the run itself, so a dry run (which publishes no
      # release) still leaves something downloadable. Short retention: this is a
      # scratch copy, the release assets are the ones that are kept.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.art.outputs.name }}
          path: release-assets/*
          retention-days: 7

      - name: Publish release
        if: steps.v.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: Buffers ${{ steps.v.outputs.version }}
          draft: true
          generate_release_notes: true
          files: release-assets/*
