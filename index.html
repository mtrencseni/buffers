<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint under the notch and home bar; the
         safe-area insets in styles.css keep the chrome out from under them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- The browser's own chrome, matched to the tab strip in each theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#dfe2e9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d232b" />
    <!-- Add to Home Screen. Worth doing on iOS beyond the standalone window:
         installed apps are exempt from Safari's 7-day eviction of
         script-writable storage, which is where the session lives. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Buffers" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Buffers</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
